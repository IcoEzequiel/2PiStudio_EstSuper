<div class="main-container">
    <div class="header-text">
        <h2 class="gradient-text">Configurações do Estúdio</h2>
        <p>Gerencie seus recursos, como equipamentos e mão de obra.</p>
    </div>

    <div class="grid-container">
        <div class="card glass-effect">
            <div class="card-header">
                <h3>
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path
                            d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z">
                        </path>
                    </svg>
                    Equipamentos
                </h3>
            </div>
            <div class="card-content">
                <div class="add-item-form" type="submit">
                    <input type="text" id="equipment-name" placeholder="Nome do equipamento">
                    <input type="number" id="equipment-cost" placeholder="Custo/h" class="cost-input">
                    <button id="add-equipment-btn" class="add-btn">
                        <svg class="icon-sm" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                </div>
                <div class="resource-list-container" id="equipment-items">
                </div>
            </div>
        </div>

        <div class="card glass-effect">
            <div class="card-header">
                <h3>
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    Mão de Obra
                </h3>
            </div>
            <div class="card-content">
                <div class="add-item-form">
                    <input type="text" id="labor-name" placeholder="Nome do profissional">
                    <input type="number" id="labor-cost" placeholder="Custo/h" class="cost-input">
                    <button id="add-labor-btn" class="add-btn">
                        <svg class="icon-sm" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                </div>
                <div class="resource-list-container" id="labor-items">
                </div>
            </div>
        </div>
    </div>
</div>

<script src="./configuracoes.js"></script>
