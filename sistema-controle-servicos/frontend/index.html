            <span class="nav-label">Dashboard</span>
          </button>
          <button data-page="projetos/projetos.html" type="button" class="nav-btn active">

             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"

              <line x1="8" x2="21" y1="12" y2="12"></line>
              <line x1="8" x2="21" y1="18" y2="18"></line>

              <line x1="3" x2="3.01" y1="18" y2="18"></line>
             <path d="M4 12h16M4 6h16M4 18h16"></path>
            </svg>
            <span class="nav-label">Projetos</span>
          </button>
          <button data-page="configuracoes/configuracoes.html" type="button" class="nav-btn active">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             class="icon">
             <path d="M4 12h16M4 6h16M4 18h16"></path>
            </svg>
            <span class="nav-label">Configurações</span>
          </button>
        </div>
        <button type="button" class="btn-novo-projeto">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" 
            viewBox="0 0 24 24" fill="none" stroke="currentColor" 
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" 
            class="icon">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M8 12h8"></path>
            <path d="M12 8v8"></path>
          </svg>
          Novo Projeto
        </button>
      </div>
    </nav>

    <div class="notificacoes" role="region" aria-label="Notifications"></div>

    <main id="conteudo" class="conteudo"></main>

    </main>

  </div>
