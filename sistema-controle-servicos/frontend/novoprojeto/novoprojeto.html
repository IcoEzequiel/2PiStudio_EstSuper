<form id="form-novo-projeto" class="form">

    <div class="modal-header">
        <h2 class="gradient-text">Criar Novo Projeto</h2>
        <button id="close-modal-btn" class="close-button" type="button">&times;</button>
    </div>

    <div class="form-grid">
        <div class="form-group">
            <label for="servico-cliente">Cliente</label>
            <select id="servico-cliente" required>
                <option value="">Selecione um cliente</option>
            </select>
        </div>
        <div class="form-group">
            <label for="projectName">Nome do Projeto *</label>
            <input type="text" id="projectName" placeholder="Nome do projeto" required>
        </div>
    </div>

    <div class="form-grid">
        <!-- <div class="form-group">
            <label for="hours">Horas Estimadas</label>
            <input type="number" id="hours" min="1" value="1">
        </div> -->
        <div class="form-group full-width">
            <label for="servico-descricao">Descrição do Projeto</label>
            <textarea id="servico-descricao" rows="3" placeholder="Detalhes sobre o serviço..."></textarea>
        </div>
    </div>

    <div class="form-grid">
        <div class="form-group">
            <label for="servico-data-inicio">Data de Início</label>
            <input type="date" id="servico-data-inicio" required>
        </div>
        <div class="form-group">
            <label for="servico-data-fim">Data de Fim</label>
            <input type="date" id="servico-data-fim" required>
        </div>
    </div>

    <div class="form-grid">
        <div class="form-group">
            <label for="equipmentSelect">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path
                        d="M4.746 1.252a1 1 0 0 1 1.415 0l3.85 3.85a1 1 0 0 1 0 1.415l-3.85 3.85a1 1 0 0 1-1.415-1.414L7.586 6 4.746 3.162a1 1 0 0 1 0-1.414z" />
                    <path
                        d="M10.254 1.252a1 1 0 0 1 .432 1.945l-3.85 3.85a1 1 0 1 1-1.415-1.415l3.85-3.85a1 1 0 0 1 .983-.52z" />
                </svg>
                Equipamentos
            </label>
            <select id="equipmentSelect">
                <option value="">Selecionar Equipamentos</option>
            </select>
        </div>
        <div class="form-group">
            <label for="laborSelect">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" />
                </svg>
                Mão de Obra
            </label>
            <select id="laborSelect">
                <option value="">Selecionar Mão de Obra</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label for="quote">Valor do Orçamento (R$)</label>
        <input type="number" id="quote" step="0.01" value="0">
    </div>

    <div class="form-switch">
        <label for="invoice">Emitir Nota Fiscal?</label>
        <label class="switch-toggle">
            <input type="checkbox" id="invoice">
            <span class="switch-slider"></span>
        </label>
    </div>

    <div class="summary-box">
        <h3>Resumo Financeiro</h3>
        <div class="summary-item">
            <span>Custo Total:</span>
            <span id="totalCosts">R$ 0.00</span>
        </div>
        <div class="summary-item">
            <span>Impostos (6%):</span>
            <span id="tax">R$ 0.00</span>
        </div>
        <div class="summary-item profit">
            <span>Lucro Estimado:</span>
            <span id="profit">R$ 0.00</span>
        </div>
    </div>

    <button type="submit" class="submit-button">Salvar Projeto</button>
</form>
