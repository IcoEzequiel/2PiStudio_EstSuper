<!-- <!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <title>Sistema de Projetos - Novo Projeto</title>
    <link rel="stylesheet" href="novoprojeto/novoprojeto.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head> -->


<form id="projectForm" class="form">
    <h2>Criar Novo Projeto</h2>
    <div class="grid">
        <div>
            <label for="clientName">Nome do Cliente</label>
            <input type="text" id="clientName" name="clientName">
        </div>

        <div>
            <label for="projectName">Nome do Projeto</label>
            <input type="text" id="projectName" name="projectName">
        </div>
    </div>

    <div class="grid">
        <div>
            <label for="hours">Horas de Trabalho</label>
            <input type="number" id="hours" name="hours" placeholder="Ex: 120">
        </div>

        <div>
            <label for="quote">Receita Estimada (Orçamento)</label>
            <input type="number" id="quote" name="quote" placeholder="Ex: 10000">
        </div>
    </div>

    <div class="grid">
        <div>
            <label for="laborSelect">Mão de Obra</label>
            <select id="laborSelect" name="laborSelect" multiple></select>
        </div>

        <div>
            <label for="equipmentSelect">Equipamentos</label>
            <select id="equipmentSelect" name="equipmentSelect" multiple></select>
        </div>
    </div>

    <div>
        <label class="checkbox-label">
            <input type="checkbox" id="invoice" name="invoice">
            Gerar Nota Fiscal (adiciona imposto de 6%)
        </label>
    </div>


    <div class="summary">
        <p><span>Resumo Financeiro</span></p>
        <p><span>Custos Totais:</span> <strong id="totalCosts">R$ 0,00</strong></p>
        <p><span>Imposto (6%):</span> <strong id="tax">R$ 0,00</strong></p>
        <p><span>Lucro Líquido:</span> <strong id="profit" class="positive">R$ 0,00</strong></p>
    </div>

    <button type="submit" class="btn">Salvar Projeto</button>
</form>
