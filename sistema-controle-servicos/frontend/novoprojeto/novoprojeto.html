<!-- <!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="novoprojeto/novoprojeto.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head> -->


<form id="form-novo-servico" class="form">
    <div class="form-section">
    <h2>Criar Novo Projeto</h2>
    <div class="grid">
        <div class="form-group">
            <label for="servico-cliente">Cliente</label>
            <select id="servico-cliente" required>
                <option value="">Selecione um cliente...</option>
            </select>
        </div>

        <div class="form-group">
            <label for="servico-nome">Nome do Projeto</label>
            <input type="text" id="servico-nome" placeholder="Ex: Gravação de Podcast" required>
        </div>
    </div>

    <div class="grid">
        <div class="form-group full-width">
            <label for="servico-descricao">Descrição do Projeto</label>
            <textarea id="servico-descricao" rows="3" placeholder="Detalhes sobre o serviço..."></textarea>
        </div>

        <div class="form-group">
            <label for="servico-orcamento">Orçamento (R$)</label>
            <input type="number" id="servico-orcamento" placeholder="Ex: 1500.00" step="0.01" min="0" required>
        </div>
    </div>
    <div class="grid">
        <div class="form-group">
            <label for="servico-data-inicio">Data de Início</label>
            <input type="date" id="servico-data-inicio" required>
        </div>
        <div class="form-group">
            <label for="servico-data-fim">Data de Fim</label>
            <input type="date" id="servico-data-fim" required>
        </div>
    </div>

    <div class="grid">
        <div class="form-section">
            <h3>Alocação de Recursos por Dia</h3>
            <p id="alocacao-placeholder">Preencha as datas de início e fim para alocar recursos.</p>
            <div id="alocacoes-diarias-container"></div>
        </div>
    </div>
    </div>

    <div>
        <label class="checkbox-label">
            <input type="checkbox" id="invoice" name="invoice">
            Gerar Nota Fiscal (adiciona imposto de 6%)
        </label>
    </div>


    <div class="summary">
        <p><span>Resumo Financeiro</span></p>
        <p><span>Custos Totais:</span> <strong id="totalCosts">R$ 0,00</strong></p>
        <p><span>Imposto (6%):</span> <strong id="tax">R$ 0,00</strong></p>
        <p><span>Lucro Líquido:</span> <strong id="profit" class="positive">R$ 0,00</strong></p>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn">Salvar Projeto</button>
    </div>
</form>
