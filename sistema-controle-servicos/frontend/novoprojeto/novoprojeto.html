<form id="form-novo-projeto" class="form">

    <div class="modal-header">
        <h2 class="gradient-text">Criar Novo Projeto</h2>
        <button id="close-modal-btn" class="close-button" type="button">&times;</button>
    </div>

    <div class="form-grid">
        <div class="form-group">
            <label for="servico-cliente">Cliente</label>
            <select id="servico-cliente" required>
                <option value="">Selecione um cliente</option>
            </select>
        </div>

        <div class="form-group">
            <label for="servico-nome">Nome do Projeto *</label>
            <input type="text" id="servico-nome" placeholder="Nome do projeto" required>
        </div>
    </div>

    <div class="form-group">
        <label for="servico-descricao">Descrição do Projeto</label>
        <textarea id="servico-descricao" rows="3" placeholder="Detalhes sobre o serviço..."></textarea>
    </div>

    <div class="form-grid">
        <div class="form-group">
            <label for="servico-data-inicio">Data de Início</label>
            <input type="date" id="servico-data-inicio" required>
        </div>
        <div class="form-group">
            <label for="servico-data-fim">Data de Fim</label>
            <input type="date" id="servico-data-fim" required>
        </div>
    </div>

    <div class="form-grid">
        <div class="form-group">
            <label for="equipmentSelect">Equipamentos</label>
            <select id="equipmentSelect"></select>
        </div>
        <div class="form-group">
            <label for="laborSelect">Mão de Obra</label>
            <select id="laborSelect"></select>
        </div>
        <!-- <div class="form-section">
            <h3>Alocação de Recursos por Dia</h3>
            <p id="alocacao-placeholder">Preencha as datas de início e fim para alocar recursos.</p>
            <div id="alocacoes-diarias-container"></div>
        </div> -->
    </div>

    <div class="form-group">
        <label for="quote">Valor do Orçamento (R$)</label>
        <input type="number" id="quote" step="0.01" value="0">
    </div>

    <div class="form-switch">
        <label for="invoice">Emitir Nota Fiscal? (Imposto de 6%)</label>
        <label class="switch-toggle">
            <input type="checkbox" id="invoice" name="invoice">
            <span class="switch-slider"></span>
        </label>
    </div>

    <div class="summary-box">
        <h3><strong>Resumo Financeiro</strong></h3>
        <div class="summary-item">
            <span>Custo Total:</span>
            <span id="totalCosts">R$ 0,00</span>
        </div>
        <div class="summary-item">
            <span>Impostos (6%):</span>
            <span id="tax">R$ 0,00</span>
        </div>
        <div class="summary-item profit">
            <span>Lucro Estimado:</span>
            <span id="profit" class="positive">R$ 0,00</span>
        </div>
    </div>

    <button type="submit" class="submit-button">Salvar Projeto</button>
</form>
