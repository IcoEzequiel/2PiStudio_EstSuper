<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Parametrização Equipamento - Sistema</title>
        <link rel="stylesheet" href="../../styles.css">
    </head>
    <body>
        <header><a href="../../index.html"> Voltar</a><h2>Parametrizações</h2></header>

        <section>
            <form id="form-paramEquip">
                <label>Equipamento:</label>
                <select id="id_equipamento" required></select>

                <label>Valor Hora: </label>
                <input id="valor_hora" type="number" step="0.01">

                <button type="submit">Salvar</button>
                <button type="button" id="btn-cancel" style="display:none">Cancelar</button>
            </form>

            <h2>Lista de Parametrizações</h2>
            <table border="1">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Equipamento</th>
                        <th>Valor Hora</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-paramEquip"></tbody>
            </table>
        </section>
        <script type="module" src="./parametrizacaoEquipamento.js"></script>
    </body>
</html>
