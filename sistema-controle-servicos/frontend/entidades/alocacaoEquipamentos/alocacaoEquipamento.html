<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Alocação Equipamento - Sistema</title>
        <link rel="stylesheet" href="../../styles.css">
    </head>
    <body>
        <header><a href="../../index.html"> Voltar</a><h2>Alocação Equipamento</h2></header>

        <section>
            <form id="form-alocacaoEquip">
                <label>Servico:</label>
                <select id="id_servico" required></select>

                <label>Equipamento: </label>
                <select id="id_equipamento" required></select>

                <label>Data:</label>
                <input type="date" id="data" required>

                <label>Horas: </label>
                <input id="horas">

                <label>Valor hora Alocado: </label>
                <input id="valor_hora_alocado" type="number", step="0.01">

                <button type="submit">Salvar</button>
                <button type="button" id="btn-cancel" style="display:none">Cancelar</button>
            </form>

            <h2>Lista de Alocações de equipamentos</h2>
            <table border="1">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Servico</th>
                        <th>Equipamento</th>
                        <th>Data</th>
                        <th>Hora</th>
                        <th>Valor hora Alocado</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="tabela-alocacaoEquip"></tbody>
            </table>
        </section>
        <script type="module" src="./alocacaoEquipamento.js"></script>
    </body>
</html>
