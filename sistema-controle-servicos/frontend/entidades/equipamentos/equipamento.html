<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Equipamento - Sistema</title>
        <link rel="stylesheet" href="../../styles.css">
    </head>
    <body>
        <header><a href="../../index.html"> Voltar</a><h2>Equipamento</h2></header>

        <section>
            <form id="form-equipamento">
                <!-- <input id="nome" placeholder="Nome" required /> -->
                <label>Nome:</label>
                <input id="nome" required>

                <label>Tipo:</label>
                <input id="tipo">

                <label>Descrição</label>
                <textarea id="descricao"></textarea>

                <label>Status:</label>
                <select id="status">
                    <option value="operacional">operacional</option>
                    <option value="quebrado">quebrado</option>
                </select>

                <button type="submit">Salvar</button>
                <button type="button" id="btn-cancel" style="display:none">Cancelar</button>
            </form>

            <h2>Lista de Equipamentos</h2>
            <table border="1">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Tipo</th>
                        <th>Descrição</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-equipamento"></tbody>
            </table>
        </section>
        <script type="module" src="./equipamento.js"></script>
    </body>
</html>
