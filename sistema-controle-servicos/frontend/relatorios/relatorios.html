<div class="reports-container">
  <div class="page-header">
    <h2 class="gradient-text">Meus Relatórios</h2>
    <p>Revise os relatórios enviados e acompanhe o status de aprovação.</p>
  </div>

  <div class="table-container">
    <table class="reports-table">
      <thead>
        <tr>
          <th>Projeto</th>
          <th>Data de Envio</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="reports-list-body">

        <!-- Exemplo 1: Relatório Pendente -->
        <tr>
          <td>
            <div class="project-name">Relatório do Projeto "Web"</div>
          </td>
          <td>
            <div class="date-cell">18/09/2025</div>
          </td>
          <td>
            <span class="badge badge-yellow">Pendente</span>
          </td>
          <td>
            <button class="btn-action edit-report-btn">Editar</button>
          </td>
        </tr>

        <!-- Exemplo 2: Relatório Aprovado -->
        <tr>
          <td>
            <div class="project-name">Relatório Semanal</div>
          </td>
          <td>
            <div class="date-cell">23/09/2025</div>
          </td>
          <td>
            <span class="badge badge-green">Aprovado</span>
          </td>
          <td>
            <button class="btn-action view-report-btn">Visualizar</button>
          </td>
        </tr>

        <!-- O JavaScript irá preencher este corpo da tabela com os dados da API -->
      </tbody>
    </table>
  </div>
</div>
