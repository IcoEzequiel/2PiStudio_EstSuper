<div class="main-container">
    <div class="page-header">
        <h2 class="gradient-text">Meus Projetos</h2>
        <p>Visualize e gerencie todos os seus projetos aqui.</p>
    </div>

    <div class="filters-container" id="project-filters">
        <button class="filter-btn active" data-filter="all">Todos</button>
        <button class="filter-btn" data-filter="agendado">Agendados</button>
        <button class="filter-btn" data-filter="em execução">Em Execução</button>
        <button class="filter-btn" data-filter="concluido">Concluídos</button>
    </div>

    <div class="list-container">
        <div id="projects-container" class="project-grid">

            <!-- Card de Exemplo (o JavaScript irá substituir isso) -->
            <div class="project-card glass-effect">
                <div class="card-header">
                    <div>
                        <h3 class="card-title">Projeto Exemplo</h3>
                        <p class="card-subtitle">Cliente Exemplo</p>
                    </div>
                    <div class="dropdown-menu">
                        <button class="card-menu-btn" aria-label="Opções do projeto">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <circle cx="12" cy="12" r="1"></circle>
                                <circle cx="12" cy="5" r="1"></circle>
                                <circle cx="12" cy="19" r="1"></circle>
                            </svg>
                        </button>
                        <div class="dropdown-content">
                            <a class="dropdown-item">Editar</a>
                            <a class="dropdown-item text-red">Excluir</a>
                        </div>
                    </div>
                </div>
                <div class="card-content">
                    <div class="card-item">
                        <span>Status</span>
                        <span class="badge badge-yellow">Orçamento</span>
                    </div>
                    <div class="card-item">
                        <span>Orçamento</span>
                        <span class="value">R$ 0,00</span>
                    </div>
                    <div class="card-item">
                        <span>Lucro</span>
                        <span class="value text-green">R$ 0,00</span>
                    </div>
                    <div class="card-item">
                        <span>Prazo</span>
                        <span class="value">dd/mm/aaaa</span>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
