<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Studio Manager</title>
    <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="login-container">

        <!-- Título principal, agora fora do card -->
        <div class="header-title">
            <h1 class="gradient-text">Studio Manager</h1>
        </div>

        <div class="login-card">
            
            <!-- Subtítulo dentro do card -->
            <div class="card-header">
                <p>Bem-vindo! Faça login para continuar.</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <div class="form-options">
                    <div class="remember-me">
                        <input type="checkbox" id="remember">
                        <label for="remember">Lembrar-me</label>
                    </div>
                    <!-- Texto do link alterado -->
                    <a href="#">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="submit-button">Entrar</button>
            </form>

            <div class="admin-link">
                <a href="#">Login como admin</a>
            </div>
        </div>
    </div>
</body>
</html>
